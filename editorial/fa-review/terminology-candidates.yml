# Tahmures Persian terminology candidate registry
# This file is intentionally a candidate registry, NOT an unconditional whitelist.
# Promote a term to `approved` only after contextual review and, when appropriate,
# synchronization with book/fa/translation-glossary.md.

meta:
  version: 1
  project: Tahmures
  scope: Persian edition
  source: human review of chapters 01-09
  created: "2026-08-19"
  canonical_policy: writing_persian_eng_books.md
  allowed_actions:
    - PRESERVE_EXACT
    - RETAIN_ENGLISH
    - TRANSLATE_PERSIAN
    - TRANSLITERATE_PERSIAN
    - REVIEW
  allowed_status:
    - candidate
    - approved
    - rejected
    - needs_context
  rules:
    - "A candidate term is not automatically retained in every context."
    - "Technical identity, searchability, interoperability, and implementation correspondence are valid reasons for English retention."
    - "Ordinary prose should normally remain Persian."
    - "Identifiers, literal fields, commands, paths, API names, and syntax are handled by PRESERVE_EXACT rather than ordinary terminology policy."
    - "Persian grammar governs the sentence around every retained English term."
    - "Do not use stylistic variation for established technical terminology."
    - "If a term changes meaning by domain or grammatical role, classify the occurrence rather than the dictionary word."
    - "An approved REVIEW entry records its contextual decision rule; it does not authorize blind replacement."

