version: 1
policy: >-
  F01 Persian strict-parity policy. A faithful Persian translation of a frozen
  English tale may legitimately fall below the 400-word narrative floor because
  Persian expression requires fewer words, not because content was omitted.
  Each exception below was recorded only after a whole-tale parity review
  removed every unsupported Persian-only addition and restored every missing
  frozen-English event. The recorded Persian word count is pinned exactly: any
  later change to a listed tale invalidates its exception until the record is
  re-reviewed and updated in a visible diff. The English 400-word floor and the
  Persian upper bound remain enforced without exception.
exceptions:
