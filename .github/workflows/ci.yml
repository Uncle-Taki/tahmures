name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - name: Install project tools
        run: python -m pip install -e ".[dev,docs]"
      - name: Run all quality gates
        run: make check

